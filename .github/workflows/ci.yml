name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build (Go only)
        run: |
          mkdir -p web/dist
          echo "<!-- ci placeholder -->" > web/dist/index.html
          go build -o bin/kite ./cmd/kite

      - name: Test
        run: go test ./... -race -cover

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Prepare embed placeholder
        run: |
          mkdir -p web/dist
          echo "<!-- placeholder -->" > web/dist/index.html
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

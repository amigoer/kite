version: 2

project_name: kite

before:
  hooks:
    - sh -c "cd web && npm install --silent && npm run build"
    - go mod tidy

builds:
  - id: kite
    main: ./cmd/kite
    binary: kite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: kite
    builds: [kite]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: amigoer
    name: kite
  draft: true
  prerelease: auto

brews:
  - name: kite
    repository:
      owner: amigoer
      name: homebrew-kite
    homepage: "https://github.com/amigoer/kite"
    description: "Programmable, replayable shell sessions for AI agents and humans."
    license: "MIT"
    test: |
      system "#{bin}/kite", "version"
    install: |
      bin.install "kite"
